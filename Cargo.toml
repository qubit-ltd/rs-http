[package]
name = "qubit-http"
version = "0.10.0"
edition = "2021"
rust-version = "1.94"
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-http"
description = "General-purpose HTTP infrastructure for Rust with unified client semantics, secure logging, and built-in SSE decoding"
homepage = "https://github.com/qubit-ltd/rs-http"
documentation = "https://docs.rs/qubit-http"
readme = "README.md"
keywords = ["http", "sse", "streaming", "network", "qubit"]
categories = ["network-programming", "asynchronous"]
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/README.zh_CN.md",
    "/RUST_CODING_STYLE.md",
    "/RUST_CODING_STYLE.zh_CN.md",
    "/doc/**/user_guide*.md",
    "/examples/**",
    "/resources/**",
    "/src/**",
    "/tests/**",
]

[lib]
name = "qubit_http"
doctest = true

[dependencies]
thiserror = "2.0"
tracing = "0.1"
reqwest = { version = "0.13", features = ["json", "stream", "query", "socks"] }
http = "1.4"
httpdate = "1.0"
url = "2.5"
bytes = { version = "1.11", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
strum = { version = "0.28", features = ["derive"] }
parse-display = "0.11"
serde_json = "1.0"
qubit-json = "0.6"
tokio = { version = "1.52", features = ["time", "net", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-stream = "0.3"
futures-util = "0.3"

qubit-config = { path = "../rs-config", version = "0.14", default-features = false }
qubit-argument = "0.4"
qubit-error = "0.2"
qubit-function = "0.16"
qubit-retry = { version = "0.17", path = "../rs-retry", features = ["tokio"] }
qubit-redact = { version = "0.4", default-features = false, features = ["http"] }

[dev-dependencies]
tokio = { version = "1.52", features = ["full", "test-util"] }
tracing-subscriber = { version = "0.3", features = ["fmt"] }
qubit-datatype = { version = "0.10", default-features = false, features = ["converter"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }
