[package]
name = "qubit-http"
version = "0.3.1"
edition = "2021"
rust-version = "1.70"
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-http"
description = "General-purpose HTTP infrastructure for Rust with unified client semantics, secure logging, and built-in SSE decoding"
homepage = "https://github.com/qubit-ltd/rs-http"
documentation = "https://docs.rs/qubit-http"
readme = "README.md"
keywords = ["http", "sse", "streaming", "network", "qubit"]
categories = ["network-programming", "asynchronous"]
exclude = [
    "coverage.sh",
    "COVERAGE.md",
    "COVERAGE.zh_CN.md",
    ".circleci/*",
    "ci-check.sh",
    ".llvm-cov.toml",
    ".cargo-audit.toml.example",
]

[lib]
name = "qubit_http"
doctest = false

[dependencies]
thiserror = "2.0"
tracing = "0.1"
reqwest = { version = "0.13", features = ["json", "stream", "query", "socks"] }
http = "1.4"
httpdate = "1.0"
url = "2.5"
bytes = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.52", features = ["time", "net", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-stream = "0.3"
futures-util = "0.3"

qubit-common = "0.5"
qubit-config = "0.8"
qubit-concurrent = "0.3"
qubit-function = "0.8"
qubit-retry = { path = "../rs-retry", version = "0.5" }

[dev-dependencies]
tokio = { version = "1.52", features = ["full", "test-util"] }
tracing-subscriber = { version = "0.3", features = ["fmt"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
